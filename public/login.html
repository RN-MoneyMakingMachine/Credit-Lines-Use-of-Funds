<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Kapital line</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login">
    <h1>Kapital line</h1>
    <p class="subtitle">AROMARIA. Enter the access code to open the shared record.</p>
    <form id="login-form" class="login-form" autocomplete="off">
      <label class="field">
        <span class="label">Access code</span>
        <input id="code" name="code" type="password" autocomplete="current-password" required autofocus>
      </label>
      <button type="submit" class="button primary" id="open">Open</button>
      <p class="error-line" id="error" role="alert"></p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
